name: Run assignment

on:
  push:
  workflow_dispatch:

jobs:
  run-code:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Run the complete analysis
        run: python -W error CS7830_Assignment_2.py
